spring.application.name=gateway
# 8000 rather than 8080: Jenkins (ci-cd) already uses 8080 on the development machine.
server.port=${SERVER_PORT:8000}

# Single public entry point. The services behind it should not be reachable from the internet.
app.services.user-url=${USER_SERVICE_URL:http://localhost:8081}
app.services.product-url=${PRODUCT_SERVICE_URL:http://localhost:8082}
app.services.order-url=${ORDER_SERVICE_URL:http://localhost:8083}
app.services.payment-url=${PAYMENT_SERVICE_URL:http://localhost:8084}

# Timeouts towards the services. Payments wait longer: a PayPal capture can take several seconds.
app.timeouts.connect=2s
app.timeouts.response=15s
app.timeouts.payment-response=45s

# Per client IP. Login/register are limited hard to stop password guessing; the rest is a flood guard.
app.rate-limit.auth-per-minute=${RATE_LIMIT_AUTH_PER_MINUTE:10}
app.rate-limit.api-per-minute=${RATE_LIMIT_API_PER_MINUTE:300}
# Only enable behind a trusted reverse proxy / load balancer that sets X-Forwarded-For itself;
# otherwise clients could spoof the header to escape the limits.
app.rate-limit.trust-forwarded-for=${RATE_LIMIT_TRUST_FORWARDED_FOR:false}

# Health endpoint for load balancers / Docker; nothing else from actuator is exposed.
management.endpoints.web.exposure.include=health
management.endpoint.health.probes.enabled=true
